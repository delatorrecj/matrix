[project]
name = "matrix-api"
version = "0.1.0"
description = "MATRIX FastAPI + WebSocket gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "pydantic",
    # Orchestrator + synthesis (Azure OpenAI GPT-5.4).
    # Never Gemini 1.5/2.0.
    "openai",
    # matrix-kernel is consumed as a path/workspace dependency -- wire at Phase 4.
    "matrix-kernel",
    # Persistence (matrix_api/db.py): psycopg3. Lazy-imported -- the in-memory
    # fallback keeps the API running without it. Pin matches packages/kernel.
    "psycopg[binary]>=3.3.4",
    # Auto-load .env files at startup so API keys and config are always available
    # without manual `$env:VAR=...` exports. Searched from CWD upward.
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "anyio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matrix_api"]

[tool.uv.sources]
matrix-kernel = { path = "../../packages/kernel", editable = true }

[tool.pytest.ini_options]
# "." -> matrix_api importable from source; kernel path -> pure kernel modules (results,
# bias_auditor, validation) importable in a bare env. SUMO-dependent tests still guard
# with pytest.importorskip("sumo"), mirroring packages/kernel (qad-matrix).
pythonpath = [".", "../../packages/kernel"]
testpaths = ["tests"]
