# MATRIX CI — kernel (pytest), api (pytest), web (vitest + next build).
#
# Design notes (read before "fixing" this file):
#
# * Jobs run in parallel and are independent; a failure in one does not cancel the others.
# * The kernel job builds a tiny Iloilo City Proper SUMO net from the committed OSM
#   fixture (`app/packages/data/fixtures/iloilo_city_proper.osm`) via native netconvert,
#   generates demand, and seeds Redis `baseline:iloilo:latest`. That un-skips
#   test_geometry_sumolib / test_timing_probe (NET/ROU existence guards) and lets
#   load_baseline() succeed. Cache key is the fixture + build scripts' hash.
#   This is NOT the ~42 MB pilot net — PERF-01 here proves simulate() on the fixture,
#   not the 90 s full-city budget.
# * `data/raw/` is still gitignored. Loaders backed by it return None and modules
#   degrade to confidence L — assert that contract by patching the loader seam
#   (tests/test_economic.py, tests/test_societal.py).
#   Deliberately no expected pass/skip count here — it went stale twice. Read the job log.
# * Playwright e2e runs against a MOCKED backend (page.route / page.routeWebSocket in
#   tests/e2e/_mock-backend.ts) — hermetic, so it needs only the Next.js server, no API/
#   Redis/SUMO. A *full-stack* e2e (live API + the 42 MB pilot net) still does not run
#   here; e2e covers the frontend render/stream path only. The kernel job's City Proper
#   fixture is a separate, SUMO-in-CI path.
# * `uv sync --locked` is strict on purpose: PRs that change a pyproject.toml must also
#   re-lock, or CI fails. Both lockfiles were verified fresh when this workflow landed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel:
    name: kernel (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATRIX_REDIS_URL: redis://127.0.0.1:6379/0
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: app/packages/kernel
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # astral-sh publishes no floating major tag for v8 — pin the release SHA (their
        # README's own convention).
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: app/packages/kernel/uv.lock
          cache-suffix: kernel
          python-version: "3.12"

      # Full locked sync: includes eclipse-sumo (manylinux wheel bundles the SUMO
      # binaries — no apt install needed) and the dev extra (pytest).
      # Heavy first run: the lock pins the CUDA torch stack via sentence-transformers.
      - name: Sync dependencies (locked, includes eclipse-sumo)
        run: uv sync --locked --extra dev

      - name: Cache SUMO fixture net + demand
        id: sumo-fixture
        uses: actions/cache@v4
        with:
          path: |
            app/packages/kernel/data/iloilo.net.xml
            app/packages/kernel/data/iloilo.rou.xml
          key: sumo-ci-fixture-${{ hashFiles('app/packages/data/fixtures/iloilo_city_proper.osm', 'app/packages/data/build_network.py', 'app/packages/data/build_demand.py') }}

      - name: Build SUMO fixture net + demand
        if: steps.sumo-fixture.outputs.cache-hit != 'true'
        run: |
          uv run --no-sync python ../data/build_network.py --from-osm ../data/fixtures/iloilo_city_proper.osm --native --validate
          uv run --no-sync python ../data/build_demand.py --end 900 --period 8 --fringe-factor 2 --seed 42 --no-smoke

      - name: Seed Redis baseline
        run: uv run --no-sync python -c "from matrix_kernel.baseline import run_nightly_baseline; print(run_nightly_baseline())"

      - name: Run kernel tests
        run: uv run --no-sync python -m pytest -q

      # Ledgers from the live fixture+baseline (VAL-01 may FAIL — that is the published result).
      - name: Generate validation and credibility reports
        run: |
          uv run --no-sync python -m matrix_kernel.build_validation_report
          uv run --no-sync python -c "from matrix_kernel.credibility import write_credibility_report; print(write_credibility_report())"

      - name: Upload validation and credibility reports
        uses: actions/upload-artifact@v4
        with:
          name: validation-credibility-reports
          path: |
            app/validation_report.json
            app/validation_report.md
            app/credibility_report.json
          if-no-files-found: error
          retention-days: 30

  api:
    name: api (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/apps/api
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # astral-sh publishes no floating major tag for v8 — pin the release SHA (their
        # README's own convention).
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: app/apps/api/uv.lock
          cache-suffix: api
          python-version: "3.12"

      # Installs matrix-api + matrix-kernel (editable path dep) from the api lockfile.
      - name: Sync dependencies (locked)
        run: uv sync --locked

      # `tests/test_ws_stream.py::test_ws_stream_all_modules` is a live integration test:
      # it drives the real WS pipeline and needs Redis with a seeded `scenario:demo:latest`
      # (or the gitignored SUMO network for a live run) — not reproducible in CI today, so
      # it is excluded via -k. When a PR makes it CI-runnable (mocked kernel/Redis), remove
      # the -k filter. pytest exit code 5 (= everything deselected / nothing collected) is
      # treated as success until API unit tests land.
      - name: Run API tests
        run: |
          if [ ! -d tests ]; then
            echo "No tests/ directory in app/apps/api yet — nothing to run (API unit tests land in a later PR)."
            exit 0
          fi
          set +e
          uv run --no-sync --with pytest python -m pytest -q -k "not test_ws_stream_all_modules"
          rc=$?
          set -e
          if [ "$rc" -eq 5 ]; then
            echo "pytest: no runnable API tests after excluding the live-integration WS stream test"
            echo "(it needs Redis + a seeded demo scenario). Passing until API unit tests land."
            exit 0
          fi
          exit "$rc"

  web:
    name: web (vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/apps/web
    steps:
      - uses: actions/checkout@v6

      - name: Install Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (vitest)
        run: npm run test -- --run

      # next build needs no env vars today (the map style is keyless OpenFreeMap and the
      # WS URL is currently hardcoded — see app/.env.example notes).
      - name: Build
        run: npm run build

  e2e:
    name: web e2e (playwright, mocked backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/apps/web
    steps:
      - uses: actions/checkout@v6

      - name: Install Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Browser binary + its OS libs. --with-deps runs apt for Chromium's shared libs.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config webServer runs `npm run start`, so build the prod server first.
      - name: Build
        run: npm run build

      # Hermetic: the backend is mocked in-test (page.route / page.routeWebSocket).
      - name: e2e (Playwright)
        run: npm run test:e2e

      # Keep the HTML report (and traces on first-retry) even when the suite fails.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/apps/web/playwright-report/
          retention-days: 7
